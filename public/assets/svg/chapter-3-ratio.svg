<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="ch3-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05256a"/>
      <stop offset="50%" stop-color="#80280b"/>
      <stop offset="100%" stop-color="#031847"/>
    </linearGradient>
    <linearGradient id="ch3-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d64511"/><stop offset="100%" stop-color="#8a1f00"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#ch3-bg)"/>

  <!-- Back Button Artwork -->
  <g transform="translate(10.8, 78.4)">
    <rect width="162" height="43.4" rx="22" fill="#ffffff" stroke="#ff9f7d" stroke-width="2"/>
    <text x="81" y="26" font-family="'Be Vietnam Pro', sans-serif" font-weight="900" font-size="14" fill="#a32800" text-anchor="middle">‹ Back to Topics</text>
  </g>

  <!-- Banner Title -->
  <g transform="translate(200, 75)" font-family="'Be Vietnam Pro', sans-serif">
    <text font-size="32" font-weight="900" fill="#ffffff">CHAPTER 3: RATIO &amp; PERCENTAGE</text>
    <text y="32" font-size="18" font-weight="700" fill="#ffd65e">Chủ đề Tỉ số &amp; Tỉ số phần trăm</text>
    <text y="58" font-size="14" fill="#ffd8cb">Luyện giải toán tỉ số, phần trăm và tỉ lệ bản đồ thực tế.</text>
  </g>

  <!-- Middle Graphic -->
  <g transform="translate(600, 250)" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif">
    <text font-size="80" font-weight="900" fill="#ffd65e">3 : 5  ·  60%</text>
  </g>

  <!-- 5 Lesson Cards -->
  <g transform="translate(6, 392)">
    <rect width="228" height="133" rx="16" fill="url(#ch3-card)" stroke="#ff9f7d" stroke-width="2"/>
    <text x="18" y="42" font-family="'Be Vietnam Pro', sans-serif" font-weight="900" font-size="17" fill="#ffffff">1. Ratio</text>
    <text x="18" y="68" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="14" fill="#ffd65e">Tỉ số</text>
  </g>

  <g transform="translate(246, 392)">
    <rect width="228" height="133" rx="16" fill="url(#ch3-card)" stroke="#ff9f7d" stroke-width="2"/>
    <text x="18" y="42" font-family="'Be Vietnam Pro', sans-serif" font-weight="900" font-size="17" fill="#ffffff">2. Word Problems</text>
    <text x="18" y="68" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="14" fill="#ffd65e">Bài toán về tỉ số</text>
  </g>

  <g transform="translate(486, 392)">
    <rect width="228" height="133" rx="16" fill="url(#ch3-card)" stroke="#ff9f7d" stroke-width="2"/>
    <text x="18" y="42" font-family="'Be Vietnam Pro', sans-serif" font-weight="900" font-size="17" fill="#ffffff">3. Percentage</text>
    <text x="18" y="68" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="14" fill="#ffd65e">Tỉ số phần trăm</text>
  </g>

  <g transform="translate(726, 392)">
    <rect width="228" height="133" rx="16" fill="url(#ch3-card)" stroke="#ff9f7d" stroke-width="2"/>
    <text x="18" y="42" font-family="'Be Vietnam Pro', sans-serif" font-weight="900" font-size="17" fill="#ffffff">4. Percentage of Number</text>
    <text x="18" y="68" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="14" fill="#ffd65e">Tìm % của 1 số</text>
  </g>

  <g transform="translate(966, 392)">
    <rect width="228" height="133" rx="16" fill="url(#ch3-card)" stroke="#ff9f7d" stroke-width="2"/>
    <text x="18" y="42" font-family="'Be Vietnam Pro', sans-serif" font-weight="900" font-size="17" fill="#ffffff">5. Map Scale</text>
    <text x="18" y="68" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="14" fill="#ffd65e">Tỉ lệ bản đồ</text>
  </g>
</svg>
