<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="lab-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04205a"/>
      <stop offset="50%" stop-color="#083893"/>
      <stop offset="100%" stop-color="#02143b"/>
    </linearGradient>
    <linearGradient id="card-game1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1268e8"/><stop offset="100%" stop-color="#083a8f"/>
    </linearGradient>
    <linearGradient id="card-game2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8e2de2"/><stop offset="100%" stop-color="#4a00e0"/>
    </linearGradient>
    <linearGradient id="card-game3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f27121"/><stop offset="100%" stop-color="#e94057"/>
    </linearGradient>
    <linearGradient id="card-game4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11998e"/><stop offset="100%" stop-color="#38ef7d"/>
    </linearGradient>
    <linearGradient id="card-game5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9966"/><stop offset="100%" stop-color="#ff5e62"/>
    </linearGradient>
    <linearGradient id="card-game6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00c6ff"/><stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#lab-bg)"/>

  <!-- Page Header -->
  <g transform="translate(40, 45)" font-family="'Be Vietnam Pro', sans-serif">
    <text font-size="32" font-weight="900" fill="#ffffff">MATH LAB <tspan fill="#8beeff">/ Vui Học Toán Tương Tác</tspan></text>
    <text y="28" font-size="16" fill="#b8dcff">Trò chơi toán học tương tác giúp rèn luyện tư duy sinh động và thú vị!</text>
  </g>

  <!-- Game 1: 3D Shape Studio (x=1.2% = 14.4, y=13% = 91, w=33% = 396, h=20% = 140) -->
  <g transform="translate(14.4, 91)">
    <rect width="396" height="140" rx="20" fill="url(#card-game1)" stroke="#8beeff" stroke-width="2"/>
    <text x="25" y="45" font-family="'Be Vietnam Pro', sans-serif" font-weight="900" font-size="22" fill="#ffffff">🎲 3D Shape Studio</text>
    <text x="25" y="72" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="16" fill="#ffd65e">Xưởng hình khối 3D</text>
    <text x="25" y="102" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#d0e7ff">Khám phá khối lập phương, hình hộp &amp; đỉnh góc 3D</text>
  </g>

  <!-- Game 2: Mixed Number Adventure (x=35% = 420, y=13% = 91, w=32% = 384, h=20% = 140) -->
  <g transform="translate(420, 91)">
    <rect width="384" height="140" rx="20" fill="url(#card-game2)" stroke="#c27eff" stroke-width="2"/>
    <text x="25" y="45" font-family="'Be Vietnam Pro', sans-serif" font-weight="900" font-size="22" fill="#ffffff">🏴‍☠️ Mixed Number Adventure</text>
    <text x="25" y="72" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="16" fill="#ffd65e">Phiêu lưu cùng hỗn số</text>
    <text x="25" y="102" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#e8cbff">Chuyển đổi hỗn số và phân số qua các chướng ngại vật</text>
  </g>

  <!-- Game 3: Mystery Pieces (x=67% = 804, y=13% = 91, w=32% = 384, h=20% = 140) -->
  <g transform="translate(804, 91)">
    <rect width="384" height="140" rx="20" fill="url(#card-game3)" stroke="#ff9f7d" stroke-width="2"/>
    <text x="25" y="45" font-family="'Be Vietnam Pro', sans-serif" font-weight="900" font-size="22" fill="#ffffff">🧩 Mystery Pieces</text>
    <text x="25" y="72" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="16" fill="#ffd65e">Mảnh ghép bí ẩn</text>
    <text x="25" y="102" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#ffd8cb">Giải câu đố quy luật dãy số để mở kho báu</text>
  </g>

  <!-- Game 4: Candy Stacker (x=2% = 24, y=37% = 259, w=28% = 336, h=22% = 154) -->
  <g transform="translate(24, 259)">
    <rect width="336" height="154" rx="20" fill="url(#card-game4)" stroke="#6ef0bd" stroke-width="2"/>
    <text x="25" y="48" font-family="'Be Vietnam Pro', sans-serif" font-weight="900" font-size="22" fill="#033d26">🍬 Candy Stacker</text>
    <text x="25" y="76" font-family="'Be Vietnam Pro', sans-serif" font-weight="800" font-size="16" fill="#012416">Xếp kẹo số thập phân</text>
    <text x="25" y="108" font-family="'Be Vietnam Pro', sans-serif" font-size="13" font-weight="600" fill="#055e3a">So sánh &amp; xếp các viên kẹo theo thứ tự</text>
  </g>

  <!-- Game 5: Drag and Drop (x=31% = 372, y=37% = 259, w=37% = 444, h=22% = 154) -->
  <g transform="translate(372, 259)">
    <rect width="444" height="154" rx="20" fill="url(#card-game5)" stroke="#ffd65e" stroke-width="2"/>
    <text x="25" y="48" font-family="'Be Vietnam Pro', sans-serif" font-weight="900" font-size="22" fill="#4a1500">🎯 Drag &amp; Drop</text>
    <text x="25" y="76" font-family="'Be Vietnam Pro', sans-serif" font-weight="800" font-size="16" fill="#2d0a00">Kéo thả đúng chỗ</text>
    <text x="25" y="108" font-family="'Be Vietnam Pro', sans-serif" font-size="13" font-weight="600" fill="#421402">Ghép từ vựng Toán Tiếng Anh với khái niệm đúng</text>
  </g>

  <!-- Game 6: Ants Food Quest (x=69% = 828, y=37% = 259, w=29% = 348, h=22% = 154) -->
  <g transform="translate(828, 259)">
    <rect width="348" height="154" rx="20" fill="url(#card-game6)" stroke="#8beeff" stroke-width="2"/>
    <text x="25" y="48" font-family="'Be Vietnam Pro', sans-serif" font-weight="900" font-size="22" fill="#ffffff">🐜 Ants Food Quest</text>
    <text x="25" y="76" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="16" fill="#ffd65e">Kiến tha mồi</text>
    <text x="25" y="108" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#d0e7ff">Tính toán vận tốc &amp; quãng đường dẫn đàn kiến</text>
  </g>
</svg>
