  <g transform="translate(609.6, 430.5)">
    <rect width="282" height="80.5" rx="14" fill="url(#ch4-card)" stroke="#6ef0bd" stroke-width="2"/>
    <text x="14" y="32" font-family="'Be Vietnam Pro', sans-serif" font-weight="900" font-size="14" fill="#ffffff">11. Speed</text>
    <text x="14" y="52" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="12" fill="#ffd65e">Vận tốc</text>
  </g>
  <g transform="translate(909.6, 430.5)">
    <rect width="282" height="80.5" rx="14" fill="url(#ch4-card)" stroke="#6ef0bd" stroke-width="2"/>
    <text x="14" y="32" font-family="'Be Vietnam Pro', sans-serif" font-weight="900" font-size="14" fill="#ffffff">12. Speed, Time, Distance</text>
    <text x="14" y="52" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="12" fill="#ffd65e">Công thức s, v, t</text>
  </g>

  <!-- Row 4: Lesson 13 (y=602) -->
  <g transform="translate(9.6, 602)">
    <rect width="282" height="84" rx="14" fill="url(#ch4-card)" stroke="#6ef0bd" stroke-width="2"/>
    <text x="14" y="34" font-family="'Be Vietnam Pro', sans-serif" font-weight="900" font-size="14" fill="#ffffff">13. Pie Chart</text>
    <text x="14" y="54" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="12" fill="#ffd65e">Biểu đồ hình quạt tròn</text>
