    <text x="14" y="32" font-family="'Be Vietnam Pro', sans-serif" font-weight="900" font-size="14" fill="#ffffff">1. Hectare &amp; Square Km</text>
    <text x="14" y="52" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="12" fill="#ffd65e">Héc-ta &amp; Km²</text>
  </g>
  <g transform="translate(309.6, 255.5)">
