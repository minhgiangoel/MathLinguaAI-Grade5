      <stop offset="0%" stop-color="#05256a"/>
      <stop offset="50%" stop-color="#08523b"/>
      <stop offset="100%" stop-color="#031847"/>
    </linearGradient>
    <linearGradient id="ch4-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00a86b"/><stop offset="100%" stop-color="#005e3e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#ch4-bg)"/>

  <!-- Back Button -->
  <g transform="translate(10.8, 78.4)">
