    <text x="14" y="32" font-family="'Be Vietnam Pro', sans-serif" font-weight="900" font-size="14" fill="#ffffff">9. Time (+ / -)</text>
    <text x="14" y="52" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="12" fill="#ffd65e">Cộng trừ đo thời gian</text>
  </g>
  <g transform="translate(309.6, 430.5)">
